name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The accounts API typechecks with the shared game code it bundles.
      - run: npm ci --prefix server
      - run: npm run typecheck --prefix server
      - run: npm run build --prefix server

  # The same scripted runs in Node, Chromium, Firefox and WebKit must hash the
  # same every 60 ticks (`npm run determinism`): co-op peers and the ranked
  # re-simulation rely on it.
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The install takes ~40 s, but now and then it stalls without a word until the
      # job times out: give each attempt 4 minutes and try up to three times.
      - name: Install browsers
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps --only-shell chromium firefox webkit && exit 0
            echo "::warning::playwright install attempt $attempt stalled or failed, retrying"
          done
          exit 1
      - run: npm run determinism
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-out
          path: determinism-out/
          if-no-files-found: ignore
